# Xcode 프로젝트의 원본. JapanTransit.xcodeproj 는 여기서 만든다:
#   xcodegen generate
# 프로젝트 설정을 Xcode 화면에서 고치면 다음 생성 때 사라진다. 이 파일을 고친다.
name: JapanTransit
options:
  bundleIdPrefix: com.leeo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  TrainBoardKit:
    url: https://github.com/M1zz/TrainBoardKit
    from: 1.2.0
  # 팁(개발자 응원하기) 화면에만 쓴다. bootstrap · 피드백 · 분석은 켜지 않았다.
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    from: 3.46.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    CODE_SIGN_STYLE: Automatic
targets:
  JapanTransit:
    type: application
    platform: iOS
    sources:
      - JapanTransit
      # 노선 데이터는 폴더째 번들에 들어간다 (Bundle 의 "lines/").
      - path: data/lines
        type: folder
        buildPhase: resources
      - path: data/transfers.json
        buildPhase: resources
      - path: data/spots
        type: folder
        buildPhase: resources
    dependencies:
      - package: TrainBoardKit
      - package: LeeoKit
      # 길 안내 중 잠금화면 · 다이내믹 아일랜드 (Live Activity)
      - target: JapanTransitWidgets
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    # 금고(LeeoVault)가 피드백 허브 컨테이너의 내 iCloud 에 백업을 올린다.
    entitlements:
      path: JapanTransit/JapanTransit.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.Ysoup.FeedbackHub]
        com.apple.developer.icloud-services: [CloudKit]
        # '곧 내려요' 알림이 집중 모드에서도 오게
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: JapanTransit/Info.plist
      properties:
        CFBundleDisplayName: 일본길찾기
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        NSCameraUsageDescription: Reads the departure board and train front so we can tell you whether to board.
        NSLocationWhenInUseUsageDescription: Finds the station nearest to you and, while guiding, which station your train is at.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.japantransit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  JapanTransitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - JapanTransitWidgets
      # 앱과 같이 쓰는 Live Activity 모양
      - JapanTransit/Shared
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    info:
      path: JapanTransitWidgets/Info.plist
      properties:
        CFBundleDisplayName: 일본길찾기
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.japantransit.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  JapanTransitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JapanTransitTests
        excludes: ["Boards/**"]
      # 카메라 시험용 전광판 그림 (scripts/make_test_boards.py 가 만든다)
      - path: JapanTransitTests/Boards
        type: folder
        buildPhase: resources
    dependencies:
      - target: JapanTransit
      - package: TrainBoardKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.japantransit.tests
schemes:
  JapanTransit:
    build:
      targets:
        JapanTransit: all
    test:
      targets:
        - JapanTransitTests

